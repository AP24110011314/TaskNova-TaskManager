<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="0" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" flood-color="#312e81" />
    </filter>
  </defs>

  <!-- App Icon Base: Squircle with Rich Indigo Gradient -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" filter="url(#subtleShadow)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="15.25" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Task Checklist Clipboard / Lines Motif -->
  <!-- Checkmark -->
  <path
    d="M18 34.5 L26 42.5 L46 22.5"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Secondary list accent bar -->
  <path
    d="M20 22 H29"
    stroke="#ffffff"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-opacity="0.85"
  />

  <!-- "Nova" Sparkle Star in Top-Right -->
  <path
    d="M48 9 C48 13.5 51.5 17 56 17 C51.5 17 48 20.5 48 25 C48 20.5 44.5 17 40 17 C44.5 17 48 13.5 48 9 Z"
    fill="url(#starGrad)"
  />
</svg>